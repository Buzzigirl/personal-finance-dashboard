    }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; background:var(--page); color:var(--text); font-family:"Noto Sans KR",system-ui,sans-serif; }

    .app { width:min(100%,700px); min-height:100vh; margin:0 auto; background:var(--page); }

    .header h1 { margin:0; font-size:1.18rem; line-height:1.25; letter-spacing:-.035em; }
    .header p { margin:3px 0 0; color:var(--muted); font-size:.78rem; }
    .as-of { flex:none; color:var(--muted); font-size:.78rem; font-weight:500; }
    main { padding:12px 10px 38px; }
    .sync { min-height:31px; display:flex; align-items:center; gap:7px; margin-bottom:8px; padding:6px 9px; border:1px solid var(--line); border-radius:10px; background:var(--surface); color:var(--muted); font-size:.76rem; }

    .summary-card { min-height:66px; padding:8px 10px; border:1px solid var(--line); border-radius:14px; background:var(--surface); box-shadow:var(--shadow); text-align:left; }

    .summary-card.answer { border:0; background:var(--orange-soft); }
    .summary-card.answer.clear { border:1px solid var(--line); background:var(--surface); }
    .summary-label { display:block; color:var(--muted); font-size:.76rem; font-weight:500; }
    .summary-value { display:block; margin-top:3px; font-size:1.12rem; font-weight:700; letter-spacing:-.035em; }
    .summary-note { display:block; margin-top:1px; color:var(--muted); font-size:.65rem; line-height:1.35; }
    .total .summary-value { color:var(--blue); font-size:1.48rem; }
    .pocket .summary-value,.pocket .summary-note { color:var(--green); }
    .answer .summary-value,.answer .summary-note { color:var(--orange); }
    .answer.clear .summary-value,.answer.clear .summary-note { color:var(--text); }

    .card-value { text-align:right; }
    .card-value strong { font-size:.78rem; white-space:nowrap; }
    .card-value small { max-width:132px; margin-top:2px; overflow:hidden; color:var(--muted); font-size:.62rem; text-overflow:ellipsis; white-space:nowrap; }
    .toggle { width:20px; height:20px; display:grid; place-items:center; color:var(--muted); font-size:1rem; }
    .toggle::before { content:"＋"; }
    details[open] > summary .toggle::before { content:"−"; }
    .meter { position:absolute; right:10px; bottom:5px; left:61px; height:3px; overflow:hidden; border-radius:10px; background:#e2e9f1; }
    .meter i { display:block; width:var(--progress,0%); height:100%; border-radius:inherit; background:var(--meter,var(--blue)); }
    .detail { padding:2px 11px 9px; border-top:1px solid var(--line); background:var(--soft); }
    .point { display:grid; grid-template-columns:1fr auto; gap:2px 8px; padding:9px 0; border-bottom:1px solid var(--line); }
    .point span,.point small { color:var(--muted); font-size:.68rem; }
    .point strong { font-size:.72rem; }
    .point small { grid-column:1/-1; }
    .transactions,.checks { margin:0; padding:0; list-style:none; }

    .transactions li:first-child,.checks li:first-child { border-top:0; }
    .transactions time,.transactions span { color:var(--muted); font-size:.72rem; line-height:1.4; }
    .transactions strong { font-size:.72rem; white-space:nowrap; }
    .transactions strong.credit { color:var(--green); }
    .checks li { min-height:42px; display:grid; grid-template-columns:18px minmax(0,1fr) auto; align-items:center; gap:8px; border-top:1px solid var(--line); }

    .checks span,.checks strong { font-size:.71rem; }
    .checks strong { white-space:nowrap; }
    .checks em { color:var(--blue); font-size:.65rem; font-style:normal; }
    .checks small { display:block; margin-top:1px; color:var(--orange); font-size:.64rem; }
    .expense-value { min-width:78px; text-align:right; }

    .pending-row .expense-value small { color:var(--orange); }

      [true,"테슬라 커넥티비티 이용료","11월 구독",9900,"11.16"]
    ];

    function normalizeText(value,maxLength){ return String(value==null?"":value).trim().slice(0,maxLength||2000); }
    function hex(bytes){ return Array.from(new Uint8Array(bytes)).map(function(value){return value.toString(16).padStart(2,"0");}).join(""); }
    function activateDevice(){
      var match=location.hash.match(/^#activate=([a-f0-9]{64})$/i);
      if(match){try{localStorage.setItem(DEVICE_KEY_NAME,match[1].toLowerCase());history.replaceState(null,"",location.pathname+location.search);}catch(error){}}
      var active=/^[a-f0-9]{64}$/.test(localStorage.getItem(DEVICE_KEY_NAME)||"");
      document.getElementById("update-button").disabled=!active;
      document.getElementById("device-status").textContent=active?"이 아이폰은 등록되었습니다. 입력이 있을 때만 맥의 Codex가 실행됩니다.":"등록되지 않은 기기입니다. 최초 1회 인증 링크를 열어주세요.";
    }
    async function signedRequest(deviceKey,text,createdAt){
      var encoder=new TextEncoder();
      var key=await crypto.subtle.importKey("raw",encoder.encode(deviceKey),{name:"HMAC",hash:"SHA-256"},false,["sign"]);
      return hex(await crypto.subtle.sign("HMAC",key,encoder.encode(createdAt+"\n"+text)));
    }
    function won(value){ return Math.abs(Number(value)||0).toLocaleString("ko-KR")+"원"; }
    function make(tag,className,text){ var node=document.createElement(tag); if(className) node.className=className; if(text!==undefined) node.textContent=text; return node; }
    function effectiveTransactions(){ return Object.assign({},DEFAULT_TRANSACTIONS,records.transactions||{}); }
    function cardAmount(card){
      var total=card.amount;
      Object.values(effectiveTransactions()).forEach(function(item){
        if(item.includedInBase!==true&&item.cardId===card.id&&item.billingCycle===BILLING_CYCLE&&item.affectsBill!==false) total+=Number(item.amount)||0;
      });
      return total;
    }
    function unresolved(){ return Object.entries(effectiveTransactions()).filter(function(entry){ return entry[1].questionRequired&&!entry[1].resolved; }); }

    function renderHeader(){
      var box=document.getElementById("sync-status");
      var labels={connecting:"연결 중",online:"실시간 동기화 중",offline:"오프라인 모드",error:"동기화 오류"};
      box.dataset.state=syncState; box.querySelector("span").textContent=labels[syncState];
      document.getElementById("offline-note").classList.toggle("show",syncState==="offline"||syncState==="error");
    }
    function summaryCard(label,value,note,className){
      var box=make("article","summary-card "+(className||""));
      box.append(make("span","summary-label",label),make("strong","summary-value",value));
      if(note) box.append(make("small","summary-note",note));
      return box;
    }
    function renderSummary(){
      var host=document.getElementById("summary"); host.replaceChildren();
      var mine=CARDS.filter(function(card){return card.id!=="hyundai_mom"&&card.id!=="kbank";}).reduce(function(sum,card){return sum+cardAmount(card);},0);
      var mom=cardAmount(CARDS.find(function(card){return card.id==="hyundai_mom";}));
      var pocket=cardAmount(CARDS.find(function(card){return card.id==="hyundai_mine";}))+cardAmount(CARDS.find(function(card){return card.id==="shinhan";}));
      var count=unresolved().length;
      host.append(summaryCard("12월 10일 전체 카드값",won(mine+mom),"확정 명세서와 신규 승인 문자 반영","total"));
      host.append(summaryCard("내 카드",won(mine),"신한 · 네이버 · 현대 MM · 삼성",""));
      host.append(summaryCard("엄마 카드",won(mom),"현대 MM",""));
      host.append(summaryCard("내 용돈 지출",won(pocket),"잔액: "+won(Math.max(0,400000-pocket)),"pocket"));
      var answer=make("button","summary-card answer"+(count?"":" clear")); answer.type="button";
      answer.append(make("span","summary-label","답변 필요"),make("strong","summary-value",count+"건"),make("small","summary-note",count?"확인하기":"확인 완료"));
      answer.addEventListener("click",function(){document.getElementById("review-section").scrollIntoView({behavior:"smooth",block:"start"});});
      host.append(answer);
    }
    function logoFor(card){
      var logo=make("span","logo "+(card.icon.indexOf("mm-")===0?card.icon:""));
      if(card.icon.indexOf("mm-")===0) logo.append(make("span","","MM"));
      else { var image=document.createElement("img"); image.src=ICONS[card.icon]; image.alt=card.company; logo.append(image); }
      return logo;
    }
    function meterFor(card){
      if(!card.performance&&!card.installment) return null;
      var current=card.performance?card.performance.current:card.installment.paid;
      var target=card.performance?card.performance.target:card.installment.total;
      var meter=make("span","meter"); meter.style.setProperty("--progress",Math.min(100,current/target*100)+"%");
      meter.style.setProperty("--meter",card.id==="naver"?"#159b70":"#2775df"); meter.append(make("i")); return meter;
    }
    function detailsFor(card){
      var wrap=make("div","detail");
      if(card.id==="shinhan"){
        var point=make("div","point"); point.append(make("span","","복지포인트"),make("strong","","현재 없음"),make("small","","발생 시 복지포인트부터 우선 사용")); wrap.append(point);
      }
      if(card.id==="naver"){
        var checks=make("ul","checks");
        FIXED_EXPENSES.forEach(function(row){
          var checked=row[0],label=row[1],month=row[2],amount=row[3],paymentDate=row[4];
          var li=make("li",checked?"":"pending-row"); var input=document.createElement("input"); input.type="checkbox"; input.checked=checked; input.disabled=true;
          var text=make("span"); text.append(document.createTextNode(label+" "),make("em","", "["+month+"]"));
          var value=make("span","expense-value"); value.append(make("strong","",amount==null?"미정":won(amount)),make("small","",checked?"결제일 "+paymentDate:"결제예상일 "+paymentDate+" 예상"));
          li.append(input,text,value); checks.append(li);
        });
        wrap.append(checks); return wrap;
      }
      var list=make("ul","transactions");
      Object.values(effectiveTransactions()).filter(function(item){return item.cardId===card.id;}).sort(function(a,b){return String(a.date).localeCompare(String(b.date),"ko");}).forEach(function(item){
        var merchant=item.detail?item.detail:item.merchant;
        var li=make("li"); li.append(make("time","",item.date||""),make("span","",merchant||"확인 필요"),make("strong",item.credit||Number(item.amount)<0?"credit":"",(Number(item.amount)<0?"−":"")+won(item.amount))); list.append(li);
      });
      if(card.id==="kbank"){ var burden=make("li"); burden.append(make("time","","부담"),make("span","","실제 교통비"),make("strong","",won(23060))); list.append(burden); }
      wrap.append(list); return wrap;
    }
    function renderList(){
      var host=document.getElementById("card-list"); var openIds=new Set(Array.from(host.querySelectorAll("details[open]")).map(function(node){return node.dataset.cardId;})); host.replaceChildren();
      CARDS.forEach(function(card){
        var details=make("details","finance-card"); details.dataset.cardId=card.id; if(openIds.has(card.id)) details.open=true;
        var summary=document.createElement("summary"); var name=make("span","card-name"); name.append(make("small","",card.company),make("strong","",card.name));
        var value=make("span","card-value"); value.append(make("strong","",won(cardAmount(card))));
        var note=card.note||card.point||"";
        if(card.performance) note=card.performance.label+" "+card.performance.current.toLocaleString("ko-KR")+" / "+card.performance.target.toLocaleString("ko-KR")+"원";
        if(card.installment) note=card.note+" · "+card.installment.paid+"/"+card.installment.total+"회";
        value.append(make("small","",note)); summary.append(logoFor(card),name,value,make("span","toggle"));
        var meter=meterFor(card); if(meter) summary.append(meter);
        details.append(summary,detailsFor(card)); host.append(details);
      });
    }
    function renderForm(){
      var host=document.getElementById("review-list"); host.replaceChildren(); var items=unresolved();
      document.getElementById("review-caption").textContent=items.length?"현대 MM 임시 분류 "+items.length+"건":"확인 완료";
      if(!items.length){host.append(make("div","empty","답변할 항목이 없습니다.")); return;}
      items.forEach(function(entry){
        var key=entry[0],item=entry[1]; var box=make("article","review-card"); box.dataset.key=key;
        var merchant=String(item.merchant||"확인 필요").replace("(구매내용 확인 필요)","");
        box.append(make("h3","review-main",(item.date||"")+" · "+merchant+" · "+won(item.amount)));
        if(item.ownerResolved&&item.owner==="mine"){
          box.append(make("p","review-question","내 카드로 반영했습니다. 무엇을 구매했나요?"));
          var area=document.createElement("textarea"); area.rows=2; area.maxLength=120; area.placeholder="예: 생활용품 구매";
          var detailSave=make("button","primary","구매내용 저장"); detailSave.type="button"; detailSave.addEventListener("click",function(){saveDetail(key,area.value);});
          box.append(area,detailSave);
        }else{
          box.append(make("p","review-question","엄마 카드로 임시 반영했습니다. 누구의 사용인가요? 선택 즉시 반영됩니다."));
          var buttons=make("div","owner-buttons");
          [["mine","내 카드"],["mom","엄마 카드"]].forEach(function(choice){
            var button=make("button","",choice[1]); button.type="button";
            button.addEventListener("click",function(){chooseOwner(key,choice[0]);}); buttons.append(button);
          });
          box.append(buttons);
        }
        host.append(box);
      });
    }
    function renderUpdateHistory(){
      var host=document.getElementById("update-history"); host.replaceChildren();
      var labels={pending:"접수 완료",processing:"처리 중",processed:"반영 완료",needs_info:"추가 확인 필요",error:"처리 오류"};
      Object.entries(records.updates||{}).sort(function(a,b){return Number(b[1].createdAt)-Number(a[1].createdAt);}).slice(0,5).forEach(function(entry){
        var item=entry[1],box=make("article","update-item"),top=make("div");
        var when=item.createdAt?new Date(item.createdAt).toLocaleString("ko-KR",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"}):"";
        top.append(make("strong","",labels[item.status]||"처리 중"),make("time","",when));
        box.append(top,make("p","",item.result||normalizeText(item.text,120))); host.append(box);
      });
    }
    function renderAll(){ renderHeader(); renderForm(); renderList(); renderSummary(); renderUpdateHistory(); }
    async function persistTransaction(key,updated,previous){
      records.transactions[key]=updated; renderAll();
      if(firebaseReady&&firebaseApi){
        try{await firebaseApi.set(firebaseApi.ref(firebaseApi.database,DB_PATH+"/transactions/"+key),updated);}
        catch(error){if(previous) records.transactions[key]=previous; else delete records.transactions[key]; renderAll(); alert("저장하지 못했습니다. 연결 상태를 확인해주세요.");}
      }
    }
    async function chooseOwner(key,owner){
      var current=effectiveTransactions()[key]; if(!current) return; var previous=records.transactions[key];
      var needsDetail=owner==="mine";
      var updated=Object.assign({},current,{cardId:needsDetail?"hyundai_mine":"hyundai_mom",owner:owner,ownerResolved:true,resolved:!needsDetail,questionRequired:needsDetail,questionType:needsDetail?"detail":"",updatedAt:Date.now()});
      await persistTransaction(key,updated,previous);
    }
    async function saveDetail(key,detail){
      var current=effectiveTransactions()[key]; if(!current) return; var cleaned=normalizeText(detail,120); if(!cleaned){alert("구매 내용을 입력해주세요.");return;}
      var previous=records.transactions[key];
      var updated=Object.assign({},current,{detail:cleaned,resolved:true,questionRequired:false,questionType:"",updatedAt:Date.now()});
      await persistTransaction(key,updated,previous);
    }
    async function saveUpdate(){
      var area=document.getElementById("update-text"),deviceKey=localStorage.getItem(DEVICE_KEY_NAME)||""; var text=normalizeText(area.value,2000); if(!text){alert("정보를 입력해주세요.");return;}
      if(!/^[a-f0-9]{64}$/.test(deviceKey)){alert("등록되지 않은 기기입니다.");return;}
      var createdAt=Date.now(),signature=await signedRequest(deviceKey,text,createdAt);
      var data={text:text,signature:signature,createdAt:createdAt,updatedAt:createdAt,status:"pending"};
      if(firebaseReady&&firebaseApi){try{var updateRef=firebaseApi.push(firebaseApi.ref(firebaseApi.database,DB_PATH+"/updates")); records.updates[updateRef.key]=data; area.value=""; renderAll(); await firebaseApi.set(updateRef,data);}catch(error){alert("저장하지 못했습니다. 연결 상태를 확인해주세요.");}}
      else {records.updates["local-"+Date.now()]=data;area.value="";alert("오프라인 임시 저장했습니다.");}
    }
    document.getElementById("update-button").addEventListener("click",saveUpdate);
    activateDevice();
    renderAll();
    (async function(){
      try{
        var appModule=await import("https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js");
        var dbModule=await import("https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js");
        var database=dbModule.getDatabase(appModule.initializeApp(firebaseConfig));
        firebaseApi={database:database,ref:dbModule.ref,push:dbModule.push,set:dbModule.set,update:dbModule.update,remove:dbModule.remove};
        var dataRef=dbModule.ref(database,DB_PATH);
        dbModule.onValue(dataRef,function(snapshot){
          records={transactions:{},updates:{}};
          if(snapshot.exists()){var value=snapshot.val()||{}; records.transactions=value.transactions||{}; records.updates=value.updates||{};}
          firebaseReady=true; syncState="online"; renderAll();
        },function(){firebaseReady=false;syncState="error";renderAll();});
      }catch(error){firebaseReady=false;syncState="offline";renderAll();}
    })();
  </script>
</body>
</html>
